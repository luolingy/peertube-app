name: peertube_app
description: "哔TV / PeerTube 全功能客户端 (tv.bi)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Localisation delegates (Chinese date pickers, etc.)
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / DI
  provider: ^6.1.5

  # Routing (deep links + browser URL on web)
  go_router: ^14.8.1

  # Networking
  dio: ^5.10.0

  # Images
  cached_network_image: ^3.4.1

  # Persistence
  shared_preferences: ^2.5.5

  # Video playback (Android / iOS / macOS / Windows / Linux / Web)
  media_kit: ^1.2.6
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.7

  # Platform integrations
  url_launcher: ^6.3.2
  file_picker: ^10.3.10
  image_picker: ^1.2.3
  mime: ^2.0.0
  path_provider: ^2.1.6
  wakelock_plus: ^1.5.2

  collection: ^1.18.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
